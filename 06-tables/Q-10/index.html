<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <caption>Department Summary</caption>

        <thead>
            <tr>
                <th scope="col" id="Name">Name</th>
                <th scope="col" id="Marks">Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td headers="Name">John</td>
                <td headers="Marks">85</td>
            </tr>
            <tr>
                <td headers="Name">Jane</td>
                <td headers="Marks">92</td>
            </tr>
            <tr>
                <td headers="Name">Mike</td>
                <td headers="Marks">78</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">Done</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
